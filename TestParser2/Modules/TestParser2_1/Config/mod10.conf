# ==================================================
# Configuration File Format Overview
# ==================================================
# version 2.0.0
#
# This configuration file format is valid for version 1.0.0 to version 2.0.0.
#
# The TestParser.ps1 script uses a configuration file to specify various
# settings and options. This file is used to customize the behavior of the
# script and provide input data.
#
# The configuration file format is a simple text file that consists of
# key-value pairs and blocks of text. The following sections describe the
# format and syntax of the configuration file.
#
# ==================================================
# EBNF Overview
# ==================================================
#
# This section provides an overview of EBNF and its usage 
# in the configuration file.
#
# Note: EBNF is used for all formatting lines below.
#
# EBNF (Extended Backus-Naur Form) is a notation for describing the syntax 
# of a language. It is used in this documentation to provide a concise 
# and formal definition of the configuration file format.
#
# For example, the syntax for a variable assignment is defined as:
#     <variable_name> '=' <string>
# This indicates that a variable assignment consists of a variable name, 
# followed by an equals sign, followed by a string.
#
# Filename
# ==================================================
#
# This section defines the required naming convention for the 
# configuration file.
#
# The filename must be: "mod?.conf"
# where:
#       ? is the module's order in JCAC. See below.
#
# EBNF Syntax
# -----------
# <filename> ::= "mod" <order> ".conf"
# <order> ::= <integer>
#
# ==================================================
# Case-Sensitivity
# ==================================================
#
# This section explains the case sensitivity rules for variable names and tags 
# in the configuration file.
#
# Variable names and tags are case-insensitive, meaning that they can be
# specified in any case (e.g., "MOD", "mod", "MoD"). However, object lines, 
# variable strings, and tags are case-sensitive, meaning that they must be 
# specified exactly as shown (e.g., "Objective 1", not "objective 1").
#
# For example:
#     mod = 1  # valid
#     MOD = 1  # valid
#     MoD = 1  # valid
#
# ==================================================
# Order of Lines in the File
# ==================================================
#
# This section describes how the order of lines in the configuration file 
# affects parsing.
#
# The order of lines in the configuration file does not affect the parsing of
# the file. This means that you can specify the lines in any order, and the 
# script will still parse the file correctly.
#
# For example:
#     mod = 1
#     title = My Module
#     htmlDirStr = /path/to/html
#
# is equivalent to:
#     title = My Module
#     htmlDirStr = /path/to/html
#     mod = 1
#
# ==================================================
# File Context
# ==================================================
#
# This section outlines the rules for valid lines and the required 
# structure within the configuration file.
#
# Lines that begin with '#' are ignored (REGEX: ^\s*#[^\n]*).
#
# Required lines:
# - One variable named "mod" assigned an integer to the current order in JCAC.
# - One Objectives block. Must have one line per "numOfObj".
#
# ==================================================
# Format for Basic Value Assignment Lines
# ==================================================
#
# This section defines the syntax for basic value assignment lines in the 
# configuration file.
#
# Format for basic value assignment lines:
#     <variable_name> '=' <string>
#         (spacing before or after '=' is ignored)
#      where: 
#         <variable_name> can be only a single, case-insensitive word of 
#         alphanumeric characters with the underscore, 
#         but cannot start with a digit. (Regex: [a-z_]\w+)
#
#         <string> can be any set of characters up to the end of line. 
#         The string does not require to be in quotes.
#         Any quotes will be retained as either single or double.
#         Any trailing whitespace will be included in the <string> 
#         if it is not enclosed in quotes. (Regex: [^\n]+)
# ==================================================
# OBJECTIVES BLOCK
# ==================================================
#
# This section provides an overview of the objectives blocks within the 
# configuration file. It details the formats for both the Module Objective 
# Block and the Daily Objectives Block, noting that only one block is 
# allowed in a given configuration file.
#
# EBNF Syntax
# -----------
# <objectives_block> ::= "<Objectives>" <objective_lines> "</Objectives>"
# <objective_lines> ::= <OBJECTIVE_LINE>+
# <OBJECTIVE_LINE> ::= "<DAYBREAK>" | [^\n]*  # One line of text per objective
#
# ==================================================
# Format for Module Objective Block
# ==================================================
#
# This section defines the format for the Module Objective block in the 
# configuration file.
#
# Format for Module Objective Block:
#    "<Objectives>"
#    <objective_line>	
#    "</Objectives>"
# where:
#    <objective_line> --> One line of text (without Mod# and Objective#) per
#    objective (Regex: [^\n]*)	
#    Ensure that the objective text is in the correct order as specified in the
#    guide.
#    The number of Module Objectives is taken from the number of lines here.
#    The variable "numOfObj" is for quality control only and is not needed.
#
# ==================================================
# Format for Daily Objectives Block
# ==================================================
#
# This section defines the format for the Daily Objectives block in the 
# configuration file.
#
# Format for Daily Objectives Block:
#    "<Objectives>"
#    <objective_line>	
#    <DAYBREAK>
#    <objective_line>	
#    <objective_line>	
#    "</Objectives>"
# where:
#    <objective_line> --> One line of text (without Mod# and Objective#) per
#    objective (Regex: [^\n]*)	
#    Ensure that the objective text is in the correct order as specified in the
#    guide.
#    "<DAYBREAK>" is only needed at the end of a day's worth of objectives.
#    The number of Daily Objectives is taken from the number of lines here.
#    The variable "numOfDays" is for quality control only and is not needed.
#
# ==================================================
# Value Assignment Names
# ==================================================
#
# This section defines the key-value assignments used in the configuration file.
# Any value name not listed in this section will be ignored.
#
# Value assignment names:
#		mod --> the Mod's Number. Used as a keyID for parsing as titles may change.
#		title --> The mod's string name.
#		objModNum --> The module's current objective number (e.g.,
#           		Programming/Scripting is '9' as of 22 May 24).
#		htmlDirStr --> The directory (absolute or relative to the ps1 file's
#           		location) where to find the HTML files to parse. 
#                   Setting does NOT create.
#					[== Obsulete -> depressiated TestParser v2.0.0		     ==]
#		saveDirStr --> The directory (absolute or relative to the ps1 file's
#           		location) where to save results. Setting does NOT create.
#		objRegexPattern --> A regular expression search string to parse the
#           		questions' HTML string. This must have at least two capture groups:		
#           				1st Capture Group will be the mod number.
#           				2nd Capture Group will be the mod objective number.
#           				3rd Capture Group will be the daily objective number.
#		nameRegexPattern --> A Regex search string to parse out the student's name
#           		from the HTML file.
#					[== Obsulete -> depressiated TestParser v2.0.0		     ==]
#		endOfQuestionRegexPattern --> A Regex search string that will signal to
#           		stop parsing a question.
#					[== Obsulete -> depressiated TestParser v2.0.0		     ==]
#		numOfObj --> The highest mod objective number.  Not used yet.
#		numOfDays --> The number of days in the Module.  0 if module objectives.
#                   Not used yet.
#		maxNumOfQuestions --> The maximum number of questions on the test.
#					[== Obsulete -> depressiated TestParser v2.0.0		     ==]
#		saveFileName --> The name of the file to save.
#
# ==================================================
# Placeholders
# ==================================================
#
# This section defines the format for placeholders in the configuration file.
# Placeholders are values that may change depending on runtime parameters.
#
# EBNF Syntax
# -----------
# <placeholder> ::= "$" <placeholder_name>
#
# Placeholders:
#		Format:  $<placeholder_name>
#			Placeholders are values whose value may change depending on runtime
#			    parameters.
#			All value assignment names above are valid placeholder names.
#			They may be used in any value assignment, except ones with REGEX in
#               their name.
# Other Allowed Placeholders
# --------------------------
#
# $CLASSNUMBER --> Placeholder for the class's number.
#
#
######################################################################################################
mod = 10
title = Programing/Scripting
objModNum = 9
numOfObj = 11
numOfDays = 8
maxNumOfQuestions = 35
saveDirStr = S:\Inst\10-Programming\Curriculum Resources (Ver. 2020-01R5)\Class Remediation
<objectives>
Understand fundamental programming concepts.
Identify different language tiers and types of programming languages.
Identify and use scripting structural components.
Create procedural scripts using fundamental concepts.
Explain object-oriented scripting concepts.
Create and analyze simple scripts.
Create object-oriented scripts using fundamental concepts.
Identify and follow network programs.
Create basic HTML web pages.
Use Python as a Common Gateway Interface (CGI) to process web pages.
Design, develop, and use regular expressions to parse data.
</objectives>
