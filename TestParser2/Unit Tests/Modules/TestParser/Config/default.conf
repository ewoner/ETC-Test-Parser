# Configuration File Format Overview
# ===============================
#
# The TestParser.ps1 script uses a configuration file to specify various settings and options.
# This file is used to customize the behavior of the script and provide input data.
#
# The configuration file format is a simple text file that consists of key-value pairs and blocks of text.
# The following sections describe the format and syntax of the configuration file.####################################################################################################################################################################
#
#
# Filename: "mod?.conf" 
#	where:
#		? is the module's order in JCAC. See below.
#	
#File Context:	
# Lines that begin with '#' are ignored (REGEX ^\s*#[^\n]*
# Required lines:
#	one Variable named "mod" assigned an integer to the current order in JCAC.
#   one Objectives Block.  Must have one line per line per "numOfObj"
#
# Note: EBNF is used for all formatting lines below.
#
# EBNF (Extended Backus-Naur Form) is a notation for describing the syntax of a language.
# It is used in this documentation to provide a concise and formal definition of the configuration file format.
#
# For example, the syntax for a variable assignment is defined as:
#     <variable_name> '=' <string>
# This indicates that a variable assignment consists of a variable name, followed by an equals sign, followed by a string.
#
# Case-Sensitivity
# ===============
# Variable names and tags are case-insensitive, meaning that they can be specified in any case (e.g., "MOD", "mod", "MoD").
# However, object lines, variable strings, and tags are case-sensitive, meaning that they must be specified exactly as shown (e.g., "Objective 1", not "objective 1").
#
# For example:
#     mod = 1  # valid
#     MOD = 1  # valid
#     MoD = 1  # valid
#     
## Order of Lines in the File
# ==========================
#
# The order of lines in the configuration file does not affect the parsing of the file.
# This means that you can specify the lines in any order, and the script will still parse the file correctly.
#
# For example:
#     mod = 1
#     title = My Module
#     htmlDirStr = /path/to/html
#
# is equivalent to:
#     title = My Module
#     htmlDirStr = /path/to/html
#     mod = 1
#	
# Format for basic value assignment lines:
#     <variables_name> '=' <string>
#			(spacing before or after '=' is  ignored)
#      where: 
#			<variable_name> can be only a signle, case-insensitive word of 
#				alpha-numaric characters with the underscore, 
#           	but cannot start with a digit. ( Regex [a-z_]\w+ )
#
#			<string>  can be any set of characters upto the end of line. 
#				The string does not require to be in quotes
#				Any quotes will be retained as either single or double.
#               Any trailing whitespace will be included in the <string> 
#                  if it is not enclosed in quotes.  ( Regex [^\n]+ )
#
# Format for Objective Block:
#	"<Objectives>"
#   	<OBJECTIVE_LINE>	
#	"</Objectives>"
# where:
#		<OBJECTIVE_LINE> --> One Line of text (without Mod# and Objective#) per objective 
#							 (Regex [^\n]*)	
#		Ensure that the objective text is in the correct order as specified in the guide
#		Number of Module Objectives is taken from the number of lines here
#       The variable "numOfObj" is for quality control only and not needed.
#
# Format for Daily Objectives Block:
#	"<Objectives>"
#   	"<DAYBREAK>"
#   	<OBJECTIVE_LINE>	
#   	"<DAYBREAK>"
#   	<OBJECTIVE_LINE>	
#	"</Objectives>"
# where:
#		<OBJECTIVE_LINE> --> One Line of text (without Mod# and Objective#) per objective 
#							 (Regex [^\n]*)	
#		Ensure that the objective text is in the correct order as specified in the guide.
#		Number of Daily Objectives is taken from the number of lines here
#       The variable "numOfDays" is for quality control only and not needed.
#
#
# Value asignment names:
#		mod --> the Mod's Number.  Used as a keyID for parsing as titles may change.
#		title --> The mod's string name.
#       objModNum --> The module's current objective number (e.g., Programming/Scripting is '9' as of 22 May 24)
#       htmlDirStr --> The directory (absolute or reletive to ps1 file's location) where to find the html files to parse.  Setting does NOT create.
#		saveDirStr -->  The directory (aboslute or reletive to ps1 file's location) where to save results.  Setting does NOT create.
#       objRegexPattern --> A regular expression search string to parse the questions' HTML string. This must have at least two capture groups:		
#				1st Capture Group will be the mod number
#				2nd Capture Group will be the mod objective number
#				3rd Capture Group will be the daily objective number
#		nameRegexPattern --> a Regex search string to parse out the student's name from the HTML file.
#       endOfQuestionRegexPattern --> a Regex search string that will signal to stop parsing a question
#		numOfObj --> The Highest mod objective number
#		numOfDays --> The Highest daily objective number
#		maxNumOfQuestions --> The maximum number of questions on the test.
#		saveFileName --> The name of the file to save.
#
# Placeholders:  (not implemented yet)
#		Format:  $<placeholder_name>
#			Placeholders are values whose value may change depending on runtime parem enters.
#			All value assignment names above are valid placeholder names
#			They may be used in any value below Except ones with REGEX in their name.
#	
#
# If either numOfObj or maxNumOfQuestions are zero (0), program will exit without parsing.
#
####################################################################################################################################################################
mod = 0
htmlDirStr = NOT CONFIGURED
saveDirStr = ./
objRegexPattern = Objective[s:\W]+(\d+)[-\.](\d+)[-\.]?(\d+)?
title = Programing/Scripting
objModNum = 1
numOfObj = 0
numOfDays = 0
maxNumOfQuestions = 0
saveFileName = Mod $mod Remediation $classNumber.xlsx
logDirStr = ./logs/
<objectives>
NOT LOADED
</objectives>
